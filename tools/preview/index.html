<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#1b1b2f">
<title>Emberhold (preview)</title>
<style>
  html, body { margin: 0; padding: 0; height: 100%; background: #1b1b2f; overflow: hidden; overscroll-behavior: none; }
  body { touch-action: none; -webkit-user-select: none; user-select: none; -webkit-touch-callout: none; }
  #game { position: fixed; inset: 0; width: 100vw; height: 100vh; height: 100dvh; display: block;
          image-rendering: pixelated; image-rendering: crisp-edges; }
  #safe { position: fixed; visibility: hidden; pointer-events: none;
          top: env(safe-area-inset-top, 0px); bottom: env(safe-area-inset-bottom, 0px);
          left: env(safe-area-inset-left, 0px); right: env(safe-area-inset-right, 0px); }
</style>
</head>
<body>
<canvas id="game"></canvas>
<div id="safe"></div>
<script src="main.js"></script>
</body>
</html>
